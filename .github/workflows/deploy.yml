
name: Deploy

# Automatically deploy after a push or merge to main.
# Manual execution is also available as a backup.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Prevent two deployments from modifying EC2 simultaneously.
concurrency:
  group: bangkok-taxi-production
  cancel-in-progress: false

jobs:
  # Step 1: Test the application
  test:
    name: Test application
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            artifacts/versions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c artifacts/versions.txt -r requirements.txt -r requirements-api.txt httpx

      - name: Run full test suite
        run: python -m pytest -q tests/

  # Step 2: Build and publish the Docker image to GHCR
  publish:
    name: Publish Docker image to GHCR
    needs: test
    runs-on: ubuntu-24.04

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Define image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" .

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  # Step 3: Deploy the exact image built in this workflow to EC2
  deploy:
    name: Deploy to AWS EC2
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy container to EC2
        uses: appleboy/ssh-action@v1

        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: IMAGE,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -eu

            echo "Logging in to GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            cleanup() {
              docker logout ghcr.io >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            echo "Pulling image for commit ${IMAGE_TAG}..."
            docker pull "${IMAGE}:${IMAGE_TAG}"

            echo "Removing previous application containers..."
            docker rm -f taxi-api || true
            docker rm -f taxi || true

            echo "Starting the new application container..."
            docker run -d \
              --name taxi-api \
              --restart unless-stopped \
              -p 80:8000 \
              "${IMAGE}:${IMAGE_TAG}"

            echo "Checking application health..."

            for attempt in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1/health; then
                echo
                echo "Deployment successful!"
                exit 0
              fi

              sleep 2
            done

            echo "Deployment health check failed."
            docker logs taxi-api || true
            exit 1
